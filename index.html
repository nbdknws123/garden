<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vườn Hoa Hồng của NOBODYKNOWS</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         HERO
    ========================== -->

    <main class="hero">

        <div class="hero-content">

            <p class="eyebrow">
                WELCOME TO NOBODYKNOWS' GARDEN
            </p>

            <h1>
                Vườn Hoa Hồng
            </h1>

            <h2>
                của NOBODYKNOWS
            </h2>

            <p class="intro">
                Một khu vườn nhỏ nơi những cái tên xa lạ
                cất giữ những câu chuyện chưa được kể.
            </p>

            <div class="rose-symbol">
                ✦
            </div>

            <button
                class="enter-button"
                onclick="document.getElementById('archive').scrollIntoView({ behavior: 'smooth' })"
            >
                DẠO VƯỜN
                <span>→</span>
            </button>

        </div>

    </main>


    <!-- =========================
         ARCHIVE PLACEHOLDER
    ========================== -->

    <section id="archive" class="archive">

        <p class="section-label">
            ROSE CHARACTER ARCHIVE
        </p>

        <h2>
            Những đóa hồng trong vườn
        </h2>

        <p class="section-description">
            Chạm vào một cái tên để bước vào câu chuyện của họ.
        </p>

        <div class="garden-line"></div>

    </section>


</body>
</html>
